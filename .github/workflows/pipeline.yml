name: Pipeline de revisión - Práctica Biblioteca

on:
  push:
  workflow_dispatch:

jobs:
  revision:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar funciones de comprobación
        run: |
          cat > /tmp/funciones.sh <<'EOF'
          total_web() {
            curl -s --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8080 \
              | grep -o 'id="total">[0-9]*' | grep -o '[0-9]*$'
          }
          total_consola() {
            docker compose exec -T db mariadb -uroot -proot -N -e "SELECT COUNT(*) FROM biblioteca_db.libros;"
          }
          esperar() {
            local esperado=$1 web consola
            web=$(total_web); consola=$(total_consola)
            echo "Web: $web | Consola: $consola | Esperado: $esperado"
            [ "$web" = "$esperado" ] && [ "$consola" = "$esperado" ]
          }
          estado_salud() {
            docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q $1)"
          }
          EOF

      - name: "1. Estructura del proyecto (5 pts)"
        id: p1
        run: |
          for f in docker-compose.yml app/Dockerfile app/index.js app/package.json database/init.sql; do
            test -f "$f" && echo "OK  $f" || { echo "FALTA $f"; exit 1; }
          done
          test -d evidencias && echo "OK  evidencias/" || { echo "FALTA evidencias/"; exit 1; }

      - name: "2. Construcción de la imagen (10 pts)"
        id: p2
        run: docker build -t biblioteca-app ./app

      - name: "3. Compose: 2 healthchecks, depends_on y red propia (10 pts)"
        id: p3
        run: |
          docker compose config > /tmp/config.yml
          cat /tmp/config.yml
          n=$(grep -c "healthcheck:" /tmp/config.yml)
          echo "Healthchecks encontrados: $n"
          [ "$n" -ge 2 ] || { echo "Se esperaban 2 healthchecks (uno por servicio)"; exit 1; }
          grep -q "service_healthy" /tmp/config.yml || { echo "Falta depends_on con service_healthy"; exit 1; }
          grep -q "red-biblioteca" /tmp/config.yml || { echo "Falta la red red-biblioteca"; exit 1; }

      - name: "4. Levantamiento de la solución (10 pts)"
        id: p4
        run: |
          docker compose up -d --build --wait
          docker compose ps
          source /tmp/funciones.sh
          echo "app: $(estado_salud app) | db: $(estado_salud db)"
          [ "$(estado_salud app)" = "healthy" ] && [ "$(estado_salud db)" = "healthy" ]

      - name: "5. Red red-biblioteca con app y db conectados (5 pts)"
        id: p5
        run: |
          docker network inspect biblioteca_red-biblioteca > /dev/null \
            || { echo "La red biblioteca_red-biblioteca no existe"; exit 1; }
          miembros=$(docker network inspect biblioteca_red-biblioteca --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "Contenedores en la red: $miembros"
          echo "$miembros" | grep -q "app" && echo "$miembros" | grep -q "db"

      - name: "6. Web + 4 registros iniciales (10 pts)"
        id: p6
        run: |
          source /tmp/funciones.sh
          curl -s http://localhost:8080
          esperar 4

      - name: "7. Inserción de 3 registros por consola (10 pts)"
        id: p7
        run: |
          docker compose exec -T db mariadb -uroot -proot biblioteca_db -e "
            INSERT INTO libros (titulo, autor, estado) VALUES
              ('Cien años de soledad', 'Gabriel García Márquez', 'Disponible'),
              ('La casa de los espíritus', 'Isabel Allende', 'Prestado'),
              ('Rayuela', 'Julio Cortázar', 'Disponible');
            SELECT * FROM libros;"

      - name: "8. Comprobación de 7 registros (5 pts)"
        id: p8
        run: |
          source /tmp/funciones.sh
          esperar 7

      - name: "9. Eliminar contenedores conservando el volumen (10 pts)"
        id: p9
        run: |
          docker compose down
          docker ps -a --filter "name=biblioteca" --format '{{.Names}}' | grep . && { echo "Quedaron contenedores"; exit 1; } || true
          docker volume inspect biblioteca_datos-db > /dev/null || { echo "El volumen no existe"; exit 1; }
          echo "Volumen conservado"

      - name: "10. Persistencia después de recrear (10 pts)"
        id: p10
        run: |
          source /tmp/funciones.sh
          docker compose up -d --wait
          esperar 7

      - name: "11. Eliminar volumen y reinicializar desde init.sql (15 pts)"
        id: p11
        run: |
          source /tmp/funciones.sh
          docker compose down -v
          docker volume inspect biblioteca_datos-db > /dev/null 2>&1 && { echo "El volumen sigue existiendo"; exit 1; } || echo "Volumen eliminado"
          docker compose up -d --wait
          esperar 4

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Limpieza
        if: always()
        run: docker compose down -v

      - name: Resultado final
        if: always()
        env:
          R1: ${{ steps.p1.outcome }}
          R2: ${{ steps.p2.outcome }}
          R3: ${{ steps.p3.outcome }}
          R4: ${{ steps.p4.outcome }}
          R5: ${{ steps.p5.outcome }}
          R6: ${{ steps.p6.outcome }}
          R7: ${{ steps.p7.outcome }}
          R8: ${{ steps.p8.outcome }}
          R9: ${{ steps.p9.outcome }}
          R10: ${{ steps.p10.outcome }}
          R11: ${{ steps.p11.outcome }}
        run: |
          VERDE=$'\e[1;32m'; ROJO=$'\e[1;31m'; GRIS=$'\e[0;90m'; CIAN=$'\e[1;36m'; NC=$'\e[0m'

          nombres=(
            "Estructura del proyecto"
            "Construcción de la imagen"
            "Compose: 2 healthchecks, depends_on y red propia"
            "Levantamiento de la solución"
            "Red red-biblioteca con app y db"
            "Web + 4 registros iniciales"
            "Inserción de 3 registros por consola"
            "Comprobación de 7 registros"
            "Eliminar contenedores conservando el volumen"
            "Persistencia después de recrear"
            "Eliminar volumen y reinicializar desde init.sql"
          )
          puntos=(5 10 10 10 5 10 10 5 10 10 15)
          obtenido=0

          {
            echo "## Resultado de la revisión - Práctica Biblioteca"
            echo ""
            echo "| Estado | Prueba | Puntos |"
            echo "|:---:|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          linea="+--------+-----------+----------------------------------------------------"
          echo "$linea"
          echo "| Estado | Puntos    | Prueba"
          echo "$linea"
          for i in "${!nombres[@]}"; do
            n=$((i + 1)); var="R$n"; estado="${!var}"; pts=${puntos[$i]}
            case "$estado" in
              success) marca="${VERDE}  [✔]  ${NC}"; md="✅"; gana=$pts ;;
              failure) marca="${ROJO}  [✘]  ${NC}"; md="❌"; gana=0 ;;
              *)       marca="${GRIS}  [-]  ${NC}"; md="⏭️"; gana=0 ;;
            esac
            obtenido=$((obtenido + gana))
            printf "| %b | %2d / %2d   | %d. %s\n" "$marca" "$gana" "$pts" "$n" "${nombres[$i]}"
            echo "| $md | $n. ${nombres[$i]} | $gana / $pts |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$linea"
          echo "  Puntaje total: ${CIAN}${obtenido} / 100${NC}"

          {
            echo ""
            echo "### Puntaje total: $obtenido / 100"
          } >> "$GITHUB_STEP_SUMMARY"
