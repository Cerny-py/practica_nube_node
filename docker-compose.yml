name: biblioteca-app
services:
  app:
    build: ./app
    container_name: biblioteca
    ports:
      - "8080:3000"
    networks:
      - red-biblioteca
      - red-db
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: app123
      DB_NAME: biblioteca_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>console.log(r.status)).catch(e=>console.log(e.cause))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  db:
    image: mariadb:11.4
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biblioteca_db
      MARIADB_USER: user
      MARIADB_PASSWORD: app123
    volumes:
      - datos-db:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot && mariadb -uroot -proot -e 'SELECT 1 FROM biblioteca_db.libros LIMIT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - red-db
networks:
  red-biblioteca:
    driver: bridge
  red-db:
    driver: bridge

volumes:
  datos-db:
